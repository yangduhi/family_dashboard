name: Deploy Family Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "web/**"
      - "src/**"
      - "tests/**"
      - "contracts/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run full verification suite
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Prepare versioned web bundle
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"][:12]
          assert re.fullmatch(r"[0-9a-f]{7,12}", sha), f"Unexpected GITHUB_SHA prefix: {sha!r}"

          shutil.rmtree("_site", ignore_errors=True)
          shutil.copytree("web", "_site")

          site = Path("_site")
          version_line = re.compile(r'^const CACHE_VERSION = "([a-z0-9-]+)";$', re.MULTILINE)
          (match,) = version_line.finditer((site / "sw.js").read_text(encoding="utf-8"))
          template = match[1]
          release = f"sha-{sha}"
          marker = f'name="family-dashboard-release" content="{template}"'
          assert marker in (site / "index.html").read_text(encoding="utf-8")
          for path in site.rglob("*"):
              if path.suffix not in {".html", ".css", ".js"}:
                  continue
              text = path.read_text(encoding="utf-8")
              text = version_line.sub(f'const CACHE_VERSION = "{release}";', text)
              text = text.replace(f"?release={template}", f"?release={release}")
              text = text.replace(marker, f'name="family-dashboard-release" content="{release}"')
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Upload web directory artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
